<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Campaign Hub | Wolf Carpenters</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Montserrat', sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .hub-container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.15);
            padding: 60px 40px;
            max-width: 600px;
            width: 100%;
            text-align: center;
        }

        .logo {
            margin-bottom: 40px;
        }

        .logo img {
            max-width: 280px;
            height: auto;
            width: 100%;
        }

        h1 {
            color: #1a1a1a;
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 15px;
            line-height: 1.3;
        }

        .subtitle {
            color: #666;
            font-size: 16px;
            font-weight: 400;
            margin-bottom: 40px;
            line-height: 1.6;
        }

        .buttons-container {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .campaign-button {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px 30px;
            border-radius: 12px;
            text-decoration: none;
            font-weight: 600;
            font-size: 18px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            position: relative;
            overflow: hidden;
        }

        .campaign-button::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: rgba(255, 255, 255, 0.2);
            transition: left 0.3s ease;
        }

        .campaign-button:hover::before {
            left: 100%;
        }

        .campaign-button:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 25px rgba(0, 0, 0, 0.15);
        }

        .google-button {
            background: linear-gradient(135deg, #4285F4 0%, #34A853 25%, #FBBC05 75%, #EA4335 100%);
            color: white;
        }

        .meta-button {
            background: #0866FF;
            color: white;
        }

        .meta-button:hover {
            background: #0552D1;
        }

        .button-icon {
            margin-right: 12px;
            font-size: 24px;
        }

        .footer-note {
            margin-top: 40px;
            padding-top: 30px;
            border-top: 1px solid #e0e0e0;
            color: #999;
            font-size: 14px;
        }

        @media (max-width: 768px) {
            .hub-container {
                padding: 40px 25px;
            }

            h1 {
                font-size: 24px;
            }

            .subtitle {
                font-size: 14px;
            }

            .campaign-button {
                padding: 18px 25px;
                font-size: 16px;
            }

            .logo img {
                max-width: 220px;
            }
        }

        @media (max-width: 480px) {
            .hub-container {
                padding: 30px 20px;
            }

            h1 {
                font-size: 20px;
            }

            .campaign-button {
                padding: 16px 20px;
                font-size: 15px;
            }
        }
    </style>
</head>
<body>
    <div class="hub-container">
        <div class="logo">
            <img src="0 - Brand Logo/logo-wolf-desktop (1).png" alt="Wolf Carpenters Logo">
        </div>
        
        <h1>Select Your Campaign Source</h1>
        <p class="subtitle">Choose the platform you came from to continue to our kitchen remodeling showcase</p>
        
        <div class="buttons-container">
            <a href="google/" class="campaign-button google-button">
                <span class="button-icon">🔍</span>
                <span>Google Ads Campaign</span>
            </a>
            
            <a href="meta/" class="campaign-button meta-button">
                <span class="button-icon">📘</span>
                <span>Meta Ads Campaign</span>
            </a>
        </div>
        
        <div class="footer-note">
            <p>This page is for campaign tracking purposes</p>
        </div>
    </div>
</body>
</html>
