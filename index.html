<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <script>
/* mg-clid v1 (MediaGrowth): guarda gclid/gbraid/wbraid/fbclid + _fbc/_fbp e anexa no envio do lead pro n8n */
(function () {
  var KEY = 'mg_clid', TTL = 90 * 864e5, IDS = ['gclid', 'gbraid', 'wbraid', 'fbclid'];
  function load() {
    try {
      var o = JSON.parse(localStorage.getItem(KEY) || sessionStorage.getItem(KEY) || '{}');
      if (o && o._t && Date.now() - o._t > TTL) return {};
      return o || {};
    } catch (e) { return {}; }
  }
  function save(o) {
    o._t = Date.now();
    var s = JSON.stringify(o);
    try { localStorage.setItem(KEY, s); } catch (e) {}
    try { sessionStorage.setItem(KEY, s); } catch (e) {}
  }
  function cookie(n) {
    var m = document.cookie.match(new RegExp('(?:^|; )' + n + '=([^;]*)'));
    return m ? decodeURIComponent(m[1]) : '';
  }
  try {
    var q = new URLSearchParams(location.search), cur = load(), novo = false;
    IDS.forEach(function (k) { var v = q.get(k); if (v) { if (!novo) { cur = {}; novo = true; } cur[k] = v; } });
    if (novo) {
      if (cur.fbclid) cur.fbc = 'fb.1.' + Date.now() + '.' + cur.fbclid;
      save(cur);
    }
  } catch (e) {}
  window.mgClid = function () {
    var o = load(), r = {};
    IDS.concat(['fbc']).forEach(function (k) { if (o[k]) r[k] = o[k]; });
    var fbc = cookie('_fbc'), fbp = cookie('_fbp');
    if (fbc) r.fbc = fbc;
    if (fbp) r.fbp = fbp;
    if (!r.fbclid && r.fbc) { var p = r.fbc.split('.'); if (p.length >= 4) r.fbclid = p.slice(3).join('.'); }
    return r;
  };
  function isLead(u) { return /easypanel\.host\/webhook\//.test(String(u || '')); }
  function enrich(body) {
    if (typeof body !== 'string') return body;
    try {
      var d = JSON.parse(body);
      if (!d || typeof d !== 'object' || Array.isArray(d)) return body;
      var c = window.mgClid();
      for (var k in c) if (!d[k]) d[k] = c[k];
      return JSON.stringify(d);
    } catch (e) { return body; }
  }
  if (window.fetch) {
    var f0 = window.fetch;
    window.fetch = function (input, init) {
      try {
        var u = typeof input === 'string' ? input : (input && input.url);
        if (isLead(u) && init && init.body) init = Object.assign({}, init, { body: enrich(init.body) });
      } catch (e) {}
      return f0.call(this, input, init);
    };
  }
  if (navigator.sendBeacon) {
    var b0 = navigator.sendBeacon.bind(navigator);
    navigator.sendBeacon = function (u, data) {
      try { if (isLead(u) && typeof data === 'string') data = enrich(data); } catch (e) {}
      return b0(u, data);
    };
  }
})();
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Campaign Hub | Wolf Carpenters</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Montserrat', sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .hub-container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.15);
            padding: 60px 40px;
            max-width: 600px;
            width: 100%;
            text-align: center;
        }

        .logo {
            margin-bottom: 40px;
        }

        .logo img {
            max-width: 280px;
            height: auto;
            width: 100%;
        }

        h1 {
            color: #1a1a1a;
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 15px;
            line-height: 1.3;
        }

        .subtitle {
            color: #666;
            font-size: 16px;
            font-weight: 400;
            margin-bottom: 40px;
            line-height: 1.6;
        }

        .buttons-container {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .campaign-button {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px 30px;
            border-radius: 12px;
            text-decoration: none;
            font-weight: 600;
            font-size: 18px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            position: relative;
            overflow: hidden;
        }

        .campaign-button::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: rgba(255, 255, 255, 0.2);
            transition: left 0.3s ease;
        }

        .campaign-button:hover::before {
            left: 100%;
        }

        .campaign-button:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 25px rgba(0, 0, 0, 0.15);
        }

        .google-button {
            background: linear-gradient(135deg, #4285F4 0%, #34A853 25%, #FBBC05 75%, #EA4335 100%);
            color: white;
        }

        .meta-button {
            background: #0866FF;
            color: white;
        }

        .meta-button:hover {
            background: #0552D1;
        }

        .pinterest-button {
            background: #E60023;
            color: white;
        }

        .pinterest-button:hover {
            background: #C5001A;
        }

        .button-icon {
            margin-right: 12px;
            font-size: 24px;
        }

        .footer-note {
            margin-top: 40px;
            padding-top: 30px;
            border-top: 1px solid #e0e0e0;
            color: #999;
            font-size: 14px;
        }

        @media (max-width: 768px) {
            .hub-container {
                padding: 40px 25px;
            }

            h1 {
                font-size: 24px;
            }

            .subtitle {
                font-size: 14px;
            }

            .campaign-button {
                padding: 18px 25px;
                font-size: 16px;
            }

            .logo img {
                max-width: 220px;
            }
        }

        @media (max-width: 480px) {
            .hub-container {
                padding: 30px 20px;
            }

            h1 {
                font-size: 20px;
            }

            .campaign-button {
                padding: 16px 20px;
                font-size: 15px;
            }
        }
    </style>
</head>
<body>
    <div class="hub-container">
        <div class="logo">
            <img src="0 - Brand Logo/logo-wolf-desktop (1).png" alt="Wolf Carpenters Logo">
        </div>
        
        <h1>Select Your Campaign Source</h1>
        <p class="subtitle">Choose the platform you came from to continue to our kitchen remodeling showcase</p>
        
        <div class="buttons-container">
            <a href="google/" class="campaign-button google-button">
                <span class="button-icon">🔍</span>
                <span>Google Ads Campaign</span>
            </a>
            
            <a href="meta/" class="campaign-button meta-button">
                <span class="button-icon">📘</span>
                <span>Meta Ads Campaign</span>
            </a>
            
            <a href="pinterest/" class="campaign-button pinterest-button">
                <span class="button-icon">📌</span>
                <span>Pinterest Ads Campaign</span>
            </a>
        </div>
        
        <div class="footer-note">
            <p>This page is for campaign tracking purposes</p>
        </div>
    </div>
</body>
</html>
